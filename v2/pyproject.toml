[project]
name = "chronos2"
version = "0.1.0"
description = "Chronos v2 — the personal trading system's v2 code, kept separate from the frozen v1 `chronos` package."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
