  - {id: B24, title: "Criterion (a): match v1's engine; five fill tests on two engines", phase: 2, size: M, model: opus, who: loop, ticks: 3, needs: [B23], spec: specs/B24-engine-parity.md}
  - {id: B25, title: "Criterion (b): our cost model plugged into the engine", phase: 2, size: S, model: opus, who: loop, ticks: 2, needs: [B24], spec: card}
  - {id: B26, title: "IBKR paper hookup on the Mac; find the nano contract", phase: 2, size: S, model: opus, who: founder, ticks: 2, needs: [B23], spec: card}
  - {id: B27, title: "Criterion (e): paper-trade nano both ways; funding, fees, nano contract bars", phase: 2, size: M, model: opus, who: founder, ticks: 3, needs: [B26], spec: card}
  - {id: B28, title: "Criterion (f): broker refuses an oversize order; a second connection can flatten", phase: 2, size: S, model: opus, who: founder, ticks: 2, needs: [B27], spec: card}
  - {id: B29, title: "Criterion (d): two strategies, two venues, one node", phase: 2, size: S, model: opus, who: founder, ticks: 2, needs: [B27], spec: card}
  - {id: B30, title: "Criterion (c): several days unattended, across a Monday re-login", phase: 2, size: S, model: opus, who: founder, ticks: 2, needs: [B28, B29], spec: card}
  - {id: B31, title: "Spike report", phase: 2, size: S, model: opus, who: loop, ticks: 2, needs: [B24, B25, B30], spec: card}
