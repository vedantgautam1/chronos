  - {id: B07, title: "Statistics II: the 28-check probe as tests, mid-rank counters, the floating-point tie case", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B06], spec: specs/B07-stats-probe-midrank.md}
  - {id: B08, title: "Statistics III: cross-checks against three outside libraries", phase: 1, size: S, model: opus, who: loop, ticks: 2, needs: [B07], spec: specs/B08-stats-oracles.md}
  - {id: B09, title: "Trial store I: Postgres harness, migrations, append-only, audit", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [G1], spec: specs/B09-store-foundation.md}
  - {id: B10, title: "Trial store II: ids, code coordinate, hypotheses, SEARCH/VERIFICATION, honest N", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B09], spec: specs/B10-trial-ontology.md}
  - {id: B11, title: "Trial store III: returns, trades, data footprint, compare guard, seal audit", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B10], spec: specs/B11-trial-payloads-footprint.md}
  - {id: B12, title: "Data I: bar schema, Parquet store, snapshot hash", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [G1], spec: specs/B12-data-schema-store.md}
  - {id: B13, title: "Data II: validate and clean", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B12], spec: specs/B13-data-validate-clean.md}
  - {id: B14, title: "Data III: the data door, seal guard, footprints", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B11, B13], spec: specs/B14-data-door.md}
  - {id: B15, title: "Data IV: file loaders (Kraken candles, Bitstamp minute set)", phase: 1, size: S, model: opus, who: loop, ticks: 2, needs: [B14], spec: specs/B15-data-loaders.md}
  - {id: B16, title: "Costs: venue fee schedules, cost components, 2x and adverse-funding stress", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B11], spec: specs/B16-costs.md}
  - {id: B17, title: "Slippage and spread measurement method", phase: 1, size: S, model: opus, who: loop, ticks: 2, needs: [B16], spec: specs/B17-slippage-method.md}
  - {id: B18, title: "Search-fragmentation warning", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B06, B11], spec: specs/B18-fragmentation-warning.md}
  - {id: B19, title: "Synthetic world generator", phase: 1, size: S, model: opus, who: loop, ticks: 2, needs: [B12], spec: specs/B19-generator.md}
  - {id: B20, title: "Touchstones as pre-registered fixtures (written down, not run)", phase: 1, size: M, model: opus, who: loop, ticks: 3, needs: [B06, B19], spec: specs/B20-touchstone-fixtures.md}
