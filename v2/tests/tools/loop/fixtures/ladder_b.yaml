# ladder_b: ladder_a with B23 and B24 given spec paths, so they are startable
# instead of cards. Rows 35 and 36 of B03's decision table run on this copy.
# The two paths are deliberately NOT files that exist: these fixtures are
# loaded with spec_root=None (structure only). The spec-path-exists rule is
# proved against the live LADDER.yaml and by test_rejects_a_missing_spec_file.
# B03's decision table runs on THIS copy, not the live ladder, so a later,
# routine change to the real ladder cannot turn this build's tests red
# (red-team second pass, finding 11). Do not edit to track the live ladder.
#
# CHRONOS v2 — the build ladder, machine-readable.
# The loop's script (v2/tools/loop/next_action.py, built in B03) reads THIS file.
# BLUEPRINT.md Part 5 is the human copy; a B03 test checks that the two agree on id, size and who, in order.
#
# Fields
#   id        B01… for builds, G0… for gates. Order in this file is the order of work.
#   title     plain words
#   phase     0–4
#   size      S | M            (BLUEPRINT 2.7; there is no L)
#   model     opus | sonnet    (BLUEPRINT 2.8; never fable, never a local model)
#   who       loop | founder   loop = may run unattended · founder = needs the founder present
#   needs     ids that must be done first; every one appears earlier in this file
#   spec      path to the full spec, or `card` when only a card exists yet (BUILD_CARDS.md)
#   ticks     build ticks allowed before the loop halts for an overrun (S: 2, M: 3)
#
# Rules the script enforces (specs/B03-loop-core.md has the full decision table)
#   - A build is done when its status file with state `merged` is on the build branch.
#   - A gate is done when docs/v2/build/gates/<id>-report.md is on `main`. Only a pull request
#     the founder approved can put it there.
#   - NEXT = the first entry, in file order, that isn't done and whose `needs` are all done.
#     `needs` decides what is runnable; file order only breaks ties. So independent chains
#     (statistics, trial store, data) don't block each other, and a build waiting on the founder
#     doesn't block loop builds whose needs are met.
#   - who: founder entries are never started by the loop; they are listed as "waiting on you".
#   - a build with spec: card can't start; the loop halts once and asks for its spec to be written.
#   - one active build at a time: while a build is open and not halted, the loop finishes it first.
#     A halted build is parked and blocks only the builds that need it.
#   - branch for a build is exactly <branch_prefix><id in lower case>, e.g. claude/b06.
#   - every action first takes the lock branch lock/<id>; a lock older than claim_hours is stale.
#   - an open GitHub issue labelled `chronos-halt` stops everything.

version: 0.2
build_branch: v2-build
branch_prefix: claude/
claim_hours: 3
max_review_rounds: 2
halt_label: chronos-halt

ladder:
  - {id: G0,  gate: true, title: "Blueprint approved", phase: 0, needs: []}

  # ---------- Phase 0 · the workshop ----------
  - {id: B01, title: "v2 project scaffold, core helpers, automatic tests", phase: 0, size: M, model: opus, who: founder, ticks: 3, needs: [G0], spec: specs/B01-scaffold.md}
  - {id: B01A, title: "canonical.py: dict keys validated like values; the fingerprint made deterministic", phase: 0, size: S, model: opus, who: founder, ticks: 2, needs: [B01], spec: specs/B01A-canonical-keys.md}
  - {id: B02, title: "The guards: tripwire checks on every pull request, protected values, code owners", phase: 0, size: M, model: opus, who: founder, ticks: 3, needs: [B01A], spec: specs/B02-guards.md}
  - {id: B03, title: "The loop's decision core: ladder reader, next action, locks", phase: 0, size: M, model: opus, who: founder, ticks: 3, needs: [B02], spec: specs/B03-loop-core.md}
  - {id: B04, title: "The loop's hands: agent definitions, commands, templates", phase: 0, size: M, model: opus, who: founder, ticks: 3, needs: [B03], spec: specs/B04-loop-agents.md}
  - {id: B05, title: "The automation's own GitHub identity, GitHub rules, attack tests, first unattended run", phase: 0, size: M, model: opus, who: founder, ticks: 3, needs: [B04], spec: specs/B05-first-unattended-run.md}
  - {id: G1,  gate: true, title: "The loop is proven", phase: 0, needs: [B05]}

  # ---------- Phase 1 · foundations (master doc §9 step 2) ----------
