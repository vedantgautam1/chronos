  - {id: B02, title: "The loop: ladder reader, next-action script, agents, commands", phase: 0, size: M, model: opus, who: founder, ticks: 3, needs: [B01], spec: specs/B02-loop-core.md}
  - {id: B03, title: "First unattended run, schedule, notifications", phase: 0, size: S, model: opus, who: founder, ticks: 2, needs: [B02], spec: specs/B03-first-unattended-run.md}
